name: CI and Docker Publish

# Trigger the workflow on pushes and PRs to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Setup permissions for GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Build and Lint the code (Standard CI)
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      - name: Install Client Dependencies
        run: cd client && npm ci
      
      - name: Lint Client
        run: cd client && npm run lint
        
      - name: Build Client (Dry Run)
        run: cd client && npm run build
      
      - name: Install Server Dependencies
        run: cd server && npm ci

  # Job 2: Build and Publish Docker Images to GHCR
  # This job only runs if Job 1 passes, and ONLY on pushes to the main branch (not PRs)
  publish-docker:
    needs: build-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The GITHUB_TOKEN is automatically generated by GitHub Actions
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push Server Image
      - name: Build and push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          # Converts repo name to lowercase to meet Docker naming requirements
          tags: ghcr.io/${{ github.repository_owner }}/careersync-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and Push Client Image
      - name: Build and push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/careersync-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
