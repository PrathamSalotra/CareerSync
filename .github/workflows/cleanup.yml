name: Scheduled Cleanup Job

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 02:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.CLEANUP_SHARED_SECRET }}" ${{ secrets.API_BASE_URL }}/api/internal/cleanup
